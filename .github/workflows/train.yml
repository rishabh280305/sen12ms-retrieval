name: Train paired-sensor model

on:
  workflow_dispatch:
    inputs:
      data_url:
        description: HTTPS URL for a lawful preprocessed SEN12MS NPZ subset
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the NPZ
        required: true
        type: string
      epochs:
        description: CPU-feasible epoch count
        required: true
        default: "5"
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ml/requirements.txt
      - name: Download and verify lawful subset
        env:
          DATA_URL: ${{ inputs.data_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 "$DATA_URL" --output subset.npz
          echo "$EXPECTED_SHA256  subset.npz" | sha256sum --check --strict
      - run: python ml/train.py --data subset.npz --epochs "${{ inputs.epochs }}" --output artifacts
      - run: python ml/export_embeddings.py --data subset.npz --model artifacts/dual_encoder.pt --output artifacts/embeddings.npz
      - uses: actions/upload-artifact@v4
        with:
          name: sen12ms-retrieval-artifacts
          path: artifacts/
          if-no-files-found: error
